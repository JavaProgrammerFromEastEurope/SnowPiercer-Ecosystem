[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "snowpiercer-energy"
version = "0.20.0"
requires-python = ">=3.10"
description = "Simulation-only SnowPiercer Energy domain model"
[tool.setuptools.packages.find]
include = ["energy*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
