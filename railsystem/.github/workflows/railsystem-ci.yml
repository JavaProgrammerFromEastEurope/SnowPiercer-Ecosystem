name: RailSystem CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  software-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Check release gates (BLOCKED until approved baseline)
        run: |
          set +e
          python -m railsystem.release_cli --output release-gate.json
          code=$?
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate
          path: release-gate.json
